<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>采集端 - 加油机自动检定监控</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0a0e17;color:#e8edf5;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;overscroll-behavior-y:none}
.header{background:linear-gradient(135deg,#1a2332,#0d2847);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e3a5f;flex-shrink:0}
.header .title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.header .dot{width:8px;height:8px;border-radius:50%;background:#ef4444;animation:blink 1.5s infinite}
.header .dot.online{background:#10b981}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.header .conn-info{font-size:11px;color:#5a6b87;text-align:right;line-height:1.4}
.video-area{flex:1;position:relative;background:#000;overflow:hidden;touch-action:none}
.video-area video{width:100%;height:100%;object-fit:scale-down;image-rendering:-webkit-optimize-contrast}
.video-area .placeholder{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#5a6b87}
.video-area .placeholder .icon{font-size:44px;margin-bottom:8px}
.video-area .placeholder p{font-size:13px}
.focus-ring{position:absolute;width:70px;height:70px;border:2px solid #fbbf24;border-radius:4px;pointer-events:none;opacity:0;transition:opacity .3s,transform .2s;z-index:10}
.focus-ring.show{opacity:1;animation:focusAnim .8s ease-out}
@keyframes focusAnim{0%{transform:translate(-50%,-50%) scale(1.5);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.zoom-control{position:absolute;bottom:80px;right:12px;z-index:10;display:none;flex-direction:column;align-items:center;gap:4px}
.zoom-control.show{display:flex}
.zoom-control label{font-size:10px;color:#fbbf24;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:4px}
.zoom-control input[type=range]{writing-mode:vertical-lr;direction:rtl;height:140px;width:28px;accent-color:#fbbf24}
.zoom-val{font-size:10px;color:#fbbf24;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:3px;font-weight:600}
.zoom-btns{display:flex;flex-direction:column;gap:3px}
.zoom-btn{width:28px;height:28px;background:rgba(0,0,0,.7);border:1px solid #374151;border-radius:6px;color:#fbbf24;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom-btn:active{background:#fbbf24;color:#000}
.caliper-overlay{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);border:2px solid #ef4444;border-radius:8px;padding:6px 12px;display:none;z-index:5}
.caliper-overlay.show{display:block}
.caliper-overlay .cl{font-size:10px;color:#f87171}
.caliper-overlay .cv{font-size:20px;font-weight:800;color:#ef4444;font-family:"Courier New",monospace;text-shadow:0 0 6px rgba(239,68,68,.5)}
.caliper-overlay .cu{font-size:12px;color:#f87171}
.rec-ind{position:absolute;top:10px;left:10px;display:none;align-items:center;gap:5px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:5px;font-size:11px;color:#ef4444;font-weight:600;z-index:5}
.rec-ind.show{display:flex}
.rec-ind .rd{width:7px;height:7px;border-radius:50%;background:#ef4444;animation:blink 1s infinite}
.dev-info{position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.6);padding:4px 10px;border-radius:5px;font-size:10px;color:#8899b0;display:none;z-index:5}
.dev-info.show{display:block}
.remote-audio-ind{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:4px;background:rgba(37,99,235,.6);padding:3px 10px;border-radius:5px;font-size:11px;color:#93c5fd;font-weight:600;z-index:5}
.remote-audio-ind.show{display:flex}
.controls{background:#111827;padding:10px 14px 18px;border-top:1px solid #1e3a5f;flex-shrink:0}
.ctrl-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.ctrl-row:last-child{margin-bottom:0}
.btn{flex:1;padding:10px 6px;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;color:#fff;transition:all .15s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.96)}
.btn-p{background:#2563eb}
.btn-p.active{background:#10b981}
.btn-s{background:#374151}
.btn-xs{flex:none;padding:8px 12px;font-size:11px}
.ptt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ptt-btn{width:54px;height:54px;border-radius:50%;border:3px solid #374151;background:#1f2937;color:#9ca3af;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .12s;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.ptt-btn:active,.ptt-btn.active{background:#ef4444;border-color:#ef4444;color:#fff;transform:scale(1.06)}
.ptt-label{font-size:11px;color:#6b7280}
.ptt-label .hint{font-size:10px;color:#4b5563}
.audio-bar{height:3px;background:#1f2937;border-radius:2px;margin-top:6px;overflow:hidden;display:none}
.audio-bar.show{display:block}
.audio-bar .bar{height:100%;background:#10b981;border-radius:2px;width:0%;transition:width .08s}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.modal-bg.show{display:block}
.settings{display:none;background:#111827;padding:16px;position:absolute;bottom:0;left:0;right:0;border-radius:14px 14px 0 0;border-top:1px solid #1e3a5f;max-height:55vh;overflow-y:auto;z-index:50}
.settings.show{display:block}
.settings h3{font-size:14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.settings h3 .x{cursor:pointer;font-size:18px;color:#6b7280}
.sg{margin-bottom:14px}
.sg label{display:block;font-size:11px;color:#6b7280;margin-bottom:4px}
.sg select,.sg input{width:100%;padding:8px;background:#1f2937;border:1px solid #374151;border-radius:6px;color:#e8edf5;font-size:13px}
.tgl-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.tgl-row .tl{font-size:12px;color:#9ca3af}
.tgl{width:40px;height:22px;background:#374151;border-radius:11px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl.on{background:#2563eb}
.tgl::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s}
.tgl.on::after{left:20px}
.log-area{background:#0a0e17;border:1px solid #1e3a5f;border-radius:6px;padding:8px;max-height:100px;overflow-y:auto;font-family:monospace;font-size:10px;color:#6b7280;margin-top:6px}
.log-area .li{margin-bottom:1px}
.log-area .li.ok{color:#34d399}
.log-area .li.err{color:#f87171}
.log-area .li.inf{color:#60a5fa}
.toast{position:fixed;top:50px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.85);color:#e8edf5;padding:6px 14px;border-radius:6px;font-size:12px;z-index:100;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.room-status{font-size:11px;color:#fbbf24;margin-top:4px;min-height:16px}
.room-status.waiting{color:#fbbf24}
.room-status.connected{color:#34d399}
.room-status.error{color:#f87171}
</style>
</head>
<body>
<div class="header">
  <div class="title"><span class="dot" id="sDot"></span>加油机检定 · 采集端</div>
  <div class="conn-info" id="connInfo">未连接</div>
</div>
<div class="video-area" id="videoArea">
  <video id="localVideo" autoplay muted playsinline></video>
  <div class="placeholder" id="ph"><div class="icon">📹</div><p>点击「开启摄像头」</p></div>
  <div class="focus-ring" id="focusRing"></div>
  <div class="zoom-control" id="zoomCtrl">
    <div class="zoom-val" id="zoomVal">1.0x</div>
    <input type="range" id="zoomSlider" min="100" max="500" value="100" orient="vertical">
    <div class="zoom-btns">
      <button class="zoom-btn" onclick="zoomIn()">+</button>
      <button class="zoom-btn" onclick="zoomOut()">−</button>

  <div class="caliper-overlay" id="calipOL">
    <div class="cl">游标卡尺读数</div>

    <div class="cu">mm</div>

  <div class="dev-info" id="devInfo"></div>
</div>

    <button class="btn btn-s btn-xs" onclick="testSpeaker()">🔈 测试</button>
    <button class="btn btn-s btn-xs" onclick="playAlertMelody('')">📢 滴滴滴</button>
    <button class="btn btn-s btn-xs" onclick="showSettings()">⚙️</button>

    <label>连接模式</label>

<script>
// ============================================================
// WebRTC 兼容性垫片：统一各浏览器 API 差异
// ============================================================
(function initWebRTCCompat(){
  // RTCPeerConnection 前缀兼容
  if(typeof window.RTCPeerConnection==='undefined'){
    window.RTCPeerConnection=window.webkitRTCPeerConnection||window.mozRTCPeerConnection;
  }
  // RTCSessionDescription 前缀兼容
  if(typeof window.RTCSessionDescription==='undefined'){
    window.RTCSessionDescription=window.webkitRTCSessionDescription||window.mozRTCSessionDescription;
  }
  // RTCIceCandidate 前缀兼容
  if(typeof window.RTCIceCandidate==='undefined'){
    window.RTCIceCandidate=window.webkitRTCIceCandidate||window.mozRTCIceCandidate;
  }
  // MediaStream 前缀兼容
  if(typeof window.MediaStream==='undefined'){
    window.MediaStream=window.webkitMediaStream||window.mozMediaStream;
  }
})();

// 安全创建 RTCPeerConnection
function createPeerConnection(config){
  if(typeof RTCPeerConnection==='undefined'){
    throw new Error('WebRTC_NOT_SUPPORTED');
  }
  return new RTCPeerConnection(config);
}

// 安全创建 RTCSessionDescription
function createSessionDescription(desc){
  if(!desc||typeof desc!=='object'){
    throw new Error('INVALID_SDP');
  }
  if(typeof RTCSessionDescription!=='undefined'){
    return new RTCSessionDescription(desc);
  }
  return desc; // 某些浏览器可直接传入原始对象
}

// 安全创建 RTCIceCandidate
function createIceCandidate(cand){
  if(!cand||typeof cand!=='object'){
    return null;
  }
  if(typeof RTCIceCandidate!=='undefined'){
    try{return new RTCIceCandidate(cand)}catch(e){return null}
  }
  return cand;
}

// 安全获取 senders
function safeGetSenders(pc){
  try{
    if(pc&&typeof pc.getSenders==='function'){
      return pc.getSenders();
    }
  }catch(e){}
  return [];
}

// 安全获取 receivers
function safeGetReceivers(pc){
  try{
    if(pc&&typeof pc.getReceivers==='function'){
      return pc.getReceivers();
    }
  }catch(e){}
  return [];
}

// 安全设置编码参数
function safeSetEncodingParams(pc){
  try{
    var senders=safeGetSenders(pc);
    for(var i=0;i<senders.length;i++){
      var s=senders[i];
      if(s&&s.track&&s.track.kind==='video'){
        if(typeof s.getParameters==='function'){
          var params=s.getParameters();
          if(params){
            if(!params.encodings||params.encodings.length===0){
              params.encodings=[{}];
            }
            if(params.encodings[0]){
              params.encodings[0].maxBitrate=4000000;
              params.encodings[0].maxFramerate=30;
            }
            if(typeof s.setParameters==='function'){
              s.setParameters(params).catch(function(){});
            }
          }
        }
        break;
      }
    }
  }catch(e){
    log('编码参数设置跳过: '+e.message,'inf');
  }
}

// ============================================================
// 极简 MQTT 3.1.1 客户端（原生 WebSocket，无需外部库）
// ============================================================
var MiniMQTT=(function(){
  function MiniMQTT(url,opts){
    this.url=url;this.opts=opts||{};
    this.ws=null;this.connected=false;this.msgHandler=null;
    this.errHandler=null;this.closeHandler=null;
    this.pingTimer=null;
  }
  MiniMQTT.prototype.connect=function(){
    var self=this;
    var urls=this.opts.urls||[this.url];
    var idx=this.opts.urlIdx||0;
    if(idx>=urls.length){if(self.errHandler)self.errHandler(new Error('所有服务器均连接失败'));return}
    this.url=urls[idx];
    this.opts.urlIdx=idx;
    log('MQTT尝试连接: '+this.url,'inf');
    try{this.ws=new WebSocket(this.url,['mqtt'])}catch(e){
      log('WebSocket创建失败: '+e.message,'err');
      self.opts.urlIdx=idx+1;
      setTimeout(function(){self.connect()},500);
      return;
    }
    this.ws.binaryType='arraybuffer';
    this.ws.onopen=function(){log('WebSocket已打开，发送CONNECT...','inf');self._sendConnect()};
    this.ws.onmessage=function(evt){self._onMessage(evt)};
    this.ws.onerror=function(e){
      log('WebSocket错误: '+self.url,'err');
      if(!self.connected){
        // 还没连上就出错，尝试下一个URL
        self.opts.urlIdx=idx+1;
        try{self.ws.close()}catch(ex){}
        setTimeout(function(){self.connect()},500);
      }else{if(self.errHandler)self.errHandler(e)}
    };
    this.ws.onclose=function(){
      self.connected=false;if(self.pingTimer)clearInterval(self.pingTimer);
      if(self.closeHandler)self.closeHandler();
    };
  };
  MiniMQTT.prototype._sendConnect=function(){
    var clientId=this.opts.clientId||'mini-'+Math.random().toString(36).substr(2,10);
    // CONNECT 包: 固定头 0x10 + 剩余长度 + 变长头 + payload
    var protocolName='MQTT';var protocolLevel=4; // MQTT 3.1.1
    var connectFlags=0x02; // Clean session
    var keepAlive=30;
    // 编码变长头
    var protoBytes=this._encodeUTF8(protocolName);
    var varHeader=[];
    varHeader.push(protoBytes.length>>8,protoBytes.length&0xFF);
    for(var i=0;i<protoBytes.length;i++)varHeader.push(protoBytes[i]);
    varHeader.push(protocolLevel,connectFlags,keepAlive>>8,keepAlive&0xFF);
    // payload: client ID
    var idBytes=this._encodeUTF8(clientId);
    var payload=[];
    payload.push(idBytes.length>>8,idBytes.length&0xFF);
    for(var i=0;i<idBytes.length;i++)payload.push(idBytes[i]);
    var remLen=varHeader.length+payload.length;
    var packet=[0x10]; // CONNECT
    packet=packet.concat(this._encodeRemLen(remLen));
    packet=packet.concat(varHeader).concat(payload);
    this.ws.send(new Uint8Array(packet).buffer);
  };
  MiniMQTT.prototype._onMessage=function(evt){
    var data=new Uint8Array(evt.data);
    if(data.length<2)return;
    var cmd=data[0]>>4;
    if(cmd===2){ // CONNACK
      this.connected=true;
      if(this.opts.onConnect)this.opts.onConnect();
      // 心跳
      var self=this;
      this.pingTimer=setInterval(function(){
        if(self.ws&&self.ws.readyState===WebSocket.OPEN){
          self.ws.send(new Uint8Array([0xC0,0x00]).buffer); // PINGREQ
        }
      },25000);
    }else if(cmd===3){ // PUBLISH
      var qos=(data[0]>>1)&0x03;
      var pos=1;var mul=1;var rem=0;var val;
      do{val=data[pos++];rem+=(val&0x7F)*mul;mul*=128}while((val&0x80)!==0&&pos<data.length);
      var topicLen=(data[pos]<<8)|data[pos+1];pos+=2;
      var topic=this._decodeUTF8(data,pos,topicLen);pos+=topicLen;
      if(qos>0)pos+=2; // msgId
      var msgBytes=data.slice(pos,pos+rem-(pos-(1+this._remLenBytes(rem))));
      // 简化：直接取剩余部分作为消息
      var msgLen=rem-((pos-1)-this._remLenBytes(rem));
      var msgText=this._decodeUTF8(data,pos,data.length-pos);
      if(this.msgHandler)this.msgHandler(topic,msgText);
    }else if(cmd===9){ // SUBACK
      // 订阅确认，忽略
    }else if(cmd===13){ // PINGRESP
      // 心跳回复，忽略
    }
  };
  MiniMQTT.prototype._remLenBytes=function(rem){
    var bytes=1;var v=rem;
    while(v>=128){v>>=7;bytes++}
    return bytes;
  };
  MiniMQTT.prototype.subscribe=function(topic){
    if(!this.connected||!this.ws||this.ws.readyState!==WebSocket.OPEN)return;
    var topicBytes=this._encodeUTF8(topic);
    var msgId=Math.floor(Math.random()*65535)+1;
    var payload=[];
    payload.push(topicBytes.length>>8,topicBytes.length&0xFF);
    for(var i=0;i<topicBytes.length;i++)payload.push(topicBytes[i]);
    payload.push(0); // QoS 0
    var varHeader=[msgId>>8,msgId&0xFF];
    var remLen=varHeader.length+payload.length;
    var packet=[0x82]; // SUBSCRIBE
    packet=packet.concat(this._encodeRemLen(remLen));
    packet=packet.concat(varHeader).concat(payload);
    this.ws.send(new Uint8Array(packet).buffer);
  };
  MiniMQTT.prototype.publish=function(topic,message){
    if(!this.connected||!this.ws||this.ws.readyState!==WebSocket.OPEN)return;
    var topicBytes=this._encodeUTF8(topic);
    var msgBytes=this._encodeUTF8(message);
    var varHeader=[];
    varHeader.push(topicBytes.length>>8,topicBytes.length&0xFF);
    for(var i=0;i<topicBytes.length;i++)varHeader.push(topicBytes[i]);
    var remLen=varHeader.length+msgBytes.length;
    var packet=[0x30]; // PUBLISH QoS 0
    packet=packet.concat(this._encodeRemLen(remLen));
    packet=packet.concat(varHeader);
    for(var i=0;i<msgBytes.length;i++)packet.push(msgBytes[i]);
    this.ws.send(new Uint8Array(packet).buffer);
  };
  MiniMQTT.prototype.end=function(){
    this.connected=false;
    if(this.pingTimer)clearInterval(this.pingTimer);
    if(this.ws){try{this.ws.close()}catch(e){}this.ws=null}
  };
  MiniMQTT.prototype._encodeUTF8=function(str){
    var bytes=[];for(var i=0;i<str.length;i++){
      var c=str.charCodeAt(i);
      if(c<128)bytes.push(c);
      else if(c<2048)bytes.push(0xC0|(c>>6),0x80|(c&0x3F));
      else if(c<65536)bytes.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F));
      else bytes.push(0xF0|(c>>18),0x80|((c>>12)&0x3F),0x80|((c>>6)&0x3F),0x80|(c&0x3F));
    }
    return bytes;
  };
  MiniMQTT.prototype._decodeUTF8=function(data,start,len){
    var str='';var i=start;var end=start+len;
    while(i<end){
      var b=data[i];
      if(b<128){str+=String.fromCharCode(b);i++}
      else if(b<224){str+=String.fromCharCode((b&0x1F)<<6|(data[i+1]&0x3F));i+=2}
      else if(b<240){str+=String.fromCharCode((b&0x0F)<<12|((data[i+1]&0x3F)<<6)|(data[i+2]&0x3F));i+=3}
      else{var cp=(b&0x07)<<18|((data[i+1]&0x3F)<<12)|((data[i+2]&0x3F)<<6)|(data[i+3]&0x3F);cp-=0x10000;str+=String.fromCharCode(0xD800+(cp>>10),0xDC00+(cp&0x3FF));i+=4}
    }
    return str;
  };
  MiniMQTT.prototype._encodeRemLen=function(n){
    var bytes=[];
    do{var b=n%128;n=Math.floor(n/128);if(n>0)b|=0x80;bytes.push(b)}while(n>0);
    return bytes;
  };
  return MiniMQTT;
})();

var MQTT_URL='wss://broker.emqx.io:8084/mqtt';
var MQTT_URLS=[
  'wss://broker.emqx.io:8084/mqtt',
  'ws://broker.emqx.io:8083/mqtt'
];
var mqttClient=null,currentRoomId=null,roomPc=null,roomDataChannel=null;
var mySenderId='col-'+Math.random().toString(36).substr(2,6);
var masterSenderId=null;

function setRoomStatus(text){
  var el=document.getElementById('roomStatus');
  if(el)el.textContent=text;
}

function joinRoom(){
  var roomId=document.getElementById('roomIdInput').value.trim();
  if(!roomId){toast('请输入房间号');return}
  currentRoomId=roomId;
  // 解锁TTS和AudioContext（需要用户交互上下文）
  unlockAudio();
  setRoomStatus('正在连接信令服务器...');
  log('房间号直连：连接MQTT服务器(broker.emqx.io)...','inf');
  document.getElementById('connInfo').innerHTML='<span style="color:#fbbf24">连接中...</span>';
  
  try{
    mqttClient=new MiniMQTT(MQTT_URL,{clientId:'fdm-col-'+roomId+'-'+mySenderId,urls:MQTT_URLS,urlIdx:0});
    mqttClient.msgHandler=function(topic,message){handleMqttMessage(message)};
    mqttClient.errHandler=function(err){
      clearTimeout(connectTimeout);
      log('MQTT错误: '+(err.message||err),'err');
      setRoomStatus('连接错误');
    };
    mqttClient.closeHandler=function(){
      log('MQTT连接已关闭','err');
      if(currentRoomId)setRoomStatus('连接断开，请重新加入');
    };
    mqttClient.opts.onConnect=function(){
      clearTimeout(connectTimeout);
      log('MQTT已连接','ok');
      var topic='fdm/room/'+roomId;
      mqttClient.subscribe(topic);
      setRoomStatus('已加入房间 '+roomId+'，等待主控端...');
      log('已订阅 '+topic+'，等待主控端...','inf');
      document.getElementById('connInfo').innerHTML='<span style="color:#fbbf24">房间 '+roomId+' 等待中</span>';
      mqttSend({type:'join',role:'collector',roomId:roomId,senderId:mySenderId});
      // 定期重播自己的存在，确保后加入的主控端能发现
      if(window._roomBroadcast)clearInterval(window._roomBroadcast);
      window._roomBroadcast=setInterval(function(){
        if(mqttClient&&mqttClient.connected&&!roomPc){
          mqttSend({type:'join',role:'collector',roomId:roomId,senderId:mySenderId});
          log('重播join消息','inf');
        }
      },3000);
    };
    
    var connectTimeout=setTimeout(function(){
      if(!mqttClient.connected){
        log('MQTT连接超时(8秒)','err');
        setRoomStatus('连接超时，请检查网络后重试');
        document.getElementById('connInfo').innerHTML='<span style="color:#f87171">超时</span>';
        toast('连接超时');
        try{mqttClient.end()}catch(e){}
      }
    },8000);
    
    mqttClient.connect();
  }catch(e){
    log('MQTT连接失败: '+e.message,'err');
    setRoomStatus('连接失败: '+e.message);
    document.getElementById('connInfo').innerHTML='<span style="color:#f87171">连接失败</span>';
  }
}

function mqttSend(msg){
  if(mqttClient&&mqttClient.connected){
    msg.senderId=msg.senderId||mySenderId;
    mqttClient.publish('fdm/room/'+currentRoomId,JSON.stringify(msg));
  }
}

function handleMqttMessage(data){
  var msg;try{msg=JSON.parse(data)}catch(e){return}
  // 忽略自己发的消息
  if(msg.senderId===mySenderId)return;
  log('MQTT收: '+msg.type+(msg.role?' ('+msg.role+')':''),'inf');
  
  switch(msg.type){
    case 'offer':
      if(msg.role==='master'){
        masterSenderId=msg.senderId;
        log('收到主控端连接请求','ok');
        setRoomStatus('收到连接请求，正在应答...');
        handleRoomOffer(msg.data);
      }
      break;
    case 'ice':
      if(msg.senderId===masterSenderId&&roomPc){
        var cand=createIceCandidate(msg.data);
        if(cand){
          roomPc.addIceCandidate(cand)
            .then(function(){log('ICE已添加','inf')})
            .catch(function(e){log('ICE添加失败: '+(e.message||e),'err')});
        }
      }
      break;
    case 'bye':
      log('主控端已离开','err');
      setRoomStatus('主控端已断开');
      updateStatus(false);
      break;
  }
}

async function handleRoomOffer(offerData){
  if(!stream){
    toast('请先开启摄像头');
    setRoomStatus('请先开启摄像头再连接');
    // 通知主控端还没准备好
    if(masterSenderId){
      mqttSend({type:'not_ready',role:'collector',roomId:currentRoomId,targetId:masterSenderId,senderId:mySenderId});
    }
    return;
  }
  // 检查 WebRTC 支持
  if(typeof RTCPeerConnection==='undefined'){
    log('当前浏览器不支持WebRTC','err');
    setRoomStatus('浏览器不支持WebRTC，请使用Chrome/Safari/Edge');
    toast('浏览器不支持视频通话');
    return;
  }
  // 检查 offer 数据有效性
  if(!offerData||typeof offerData!=='object'){
    log('收到无效的offer数据','err');
    setRoomStatus('连接数据异常');
    return;
  }
  try{
    // 如果已有连接，先关闭
    if(roomPc){try{roomPc.close()}catch(e){}roomPc=null}
    
    roomPc=createPeerConnection({iceServers:[
      {urls:'stun:stun.qq.com:3478'},
      {urls:'stun:stun.miwifi.com:3478'}
    ]});
    // 添加本地视频和音频轨道
    if(stream&&stream.getTracks){
      stream.getTracks().forEach(function(t){
        try{roomPc.addTrack(t,stream)}catch(e){log('添加轨道失败: '+e.message,'err')}
      });
    }
    // 优化视频编码参数（安全调用）
    safeSetEncodingParams(roomPc);
    // 接收主控端音频流
    roomPc.ontrack=function(e){
      log('收到远端轨道: kind='+e.track.kind,'ok');
      var remoteStream;
      try{
        remoteStream=(e.streams&&e.streams[0])?e.streams[0]:new MediaStream();
        if(!e.streams||!e.streams[0])remoteStream.addTrack(e.track);
      }catch(ex){
        remoteStream=new MediaStream();
        try{remoteStream.addTrack(e.track)}catch(e2){}
      }
      if(e.track.kind==='audio'){
        // 远程音频到达，用多种方式确保播放
        attachRemoteAudio(remoteStream);
      }
    };
    // 数据通道（接收命令）
    roomPc.ondatachannel=function(e){
      if(!e||!e.channel){log('数据通道事件异常','err');return}
      roomDataChannel=e.channel;
      roomDataChannel.onmessage=function(ev){
        try{var data=JSON.parse(ev.data);handleCommand(data)}catch(ex){}
      };
      roomDataChannel.onopen=function(){log('数据通道已建立','ok')};
    };
    // ICE状态
    roomPc.oniceconnectionstatechange=function(){
      if(!roomPc)return;
      var st=roomPc.iceConnectionState;
      log('ICE状态: '+st,'inf');
      if(st==='connected'||st==='completed'){
        updateStatus(true);setRoomStatus('连接成功！');log('P2P连接成功！','ok');toast('已连接主控端');
        // 检查收发器状态
        var receivers=safeGetReceivers(roomPc);
        receivers.forEach(function(r){
          if(r&&r.track&&r.track.kind==='audio'){
            log('接收音频轨道: '+r.track.label+' enabled='+r.track.enabled+' muted='+r.track.muted,'inf');
          }
        });
        // 确保远程音频播放
        if(remoteAudioEl&&remoteAudioEl.srcObject){
          remoteAudioEl.muted=false;remoteAudioEl.volume=1.0;
          remoteAudioEl.play().catch(function(){});
        }
        if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume()}
        // ICE恢复后确保本地视频轨道仍然在发送
        var senders=safeGetSenders(roomPc);
        senders.forEach(function(s){
          if(s&&s.track&&s.track.kind==='video'){
            if(!s.track.enabled){s.track.enabled=true;log('视频轨道重新启用','ok')}
          }
        });
      }else if(st==='disconnected'){
        // disconnected是临时的，浏览器会自动尝试恢复，不要断开
        log('ICE临时断开(disconnected)，等待自动恢复...','inf');
        setRoomStatus('连接不稳定，恢复中...');
      }else if(st==='failed'||st==='closed'){
        updateStatus(false);setRoomStatus('连接已断开');log('P2P断开('+st+')','err');
      }
    };
    // ICE candidate 转发
    roomPc.onicecandidate=function(e){
      if(e.candidate&&masterSenderId){
        mqttSend({type:'ice',role:'collector',roomId:currentRoomId,targetId:masterSenderId,data:e.candidate});
      }
    };
    // 设置远端描述（offer）
    await roomPc.setRemoteDescription(createSessionDescription(offerData));
    log('已设置远端offer','ok');
    // 创建answer
    var answer=await roomPc.createAnswer();
    await roomPc.setLocalDescription(answer);
    // 等待ICE收集（给足时间收集host candidate）
    await waitForIce(roomPc,2000);
    // 发送answer（包含已收集的candidate）
    if(roomPc&&roomPc.localDescription){
      mqttSend({type:'answer',role:'collector',roomId:currentRoomId,targetId:masterSenderId,data:roomPc.localDescription});
      log('Answer已发送','ok');
      setRoomStatus('已应答，等待P2P连接建立...');
    }else{
      log('localDescription为空，无法发送answer','err');
      setRoomStatus('应答生成失败');
    }
  }catch(e){
    log('处理offer失败: '+e.message,'err');setRoomStatus('连接失败: '+e.message);toast('连接失败');
  }
}

function handleCommand(data){
  // 实时对讲模式：音频始终播放，不需要talk_start/stop
  if(data.type==='talk_start'||data.type==='talk_stop'){
    // 兼容旧版主控端，忽略
    return;
  }
  else if(data.type==='flash')toggleFlash();
  else if(data.type==='switch_cam')switchCam();
  else if(data.type==='listen_on'){
    // 主控端开启监听：恢复Web Audio API增益
    if(remoteAudioGain){remoteAudioGain.gain.value=1.5}
    if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume()}
    toast('主控端已开启监听');log('主控端开启监听','ok');
  }
  else if(data.type==='listen_off'){
    // 主控端关闭监听：静音
    if(remoteAudioGain){remoteAudioGain.gain.value=0}
    toast('主控端已关闭监听');log('主控端关闭监听','inf');
  }
  else if(data.type==='phrase'){
    toast(data.text);
    log('收到短语: '+data.text,'inf');
    // Web Audio API: 确保音量恢复
    if(remoteAudioGain){remoteAudioGain.gain.value=1.5}
    if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume()}
    speakText(data.text);
  }
}

// ====== 远程音频播放（双通道：Audio元素 + Web Audio API + AnalyserNode诊断）======
function attachRemoteAudio(remoteStream){
  log('attachRemoteAudio: 开始处理远程音频流','inf');
  currentRemoteStream=remoteStream;
  
  // 显示诊断面板
  var diag=document.getElementById('audioDiag');
  if(diag)diag.style.display='block';
  
  // 检查流中的音频轨道
  var audioTracks=remoteStream.getAudioTracks();
  log('远程流音频轨道数: '+audioTracks.length,'inf');
  if(audioTracks.length>0){
    var t=audioTracks[0];
    log('音频轨道: label='+t.label+' enabled='+t.enabled+' muted='+t.muted+' readyState='+t.readyState,'inf');
    // 监听轨道状态变化
    t.onunmute=function(){log('远程音频轨道unmute','ok')};
    t.onmute=function(){log('远程音频轨道mute','inf')};
    t.onended=function(){log('远程音频轨道ended','err')};
  }else{
    log('警告: 远程流中没有音频轨道！','err');
  }
  
  // 确保AudioContext已激活
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){log('AudioContext创建失败: '+e.message,'err')}}
  if(audioCtx&&audioCtx.state==='suspended'){
    audioCtx.resume().then(function(){log('AudioContext已resume','ok')}).catch(function(e){log('AudioContext resume失败: '+e.message,'err')});
  }
  log('AudioContext状态: '+(audioCtx?audioCtx.state:'null'),'inf');
  
  // 方法1: Audio元素播放（仅用于解锁，Web Audio API建立后静音避免双重播放+啸叫）
  try{
    if(!remoteAudioEl){remoteAudioEl=document.getElementById('remoteAudioEl')}
    if(remoteAudioEl){
      remoteAudioEl.srcObject=remoteStream;
      remoteAudioEl.volume=1.0;
      remoteAudioEl.muted=false;
      var playPromise=remoteAudioEl.play();
      if(playPromise&&playPromise.then){
        playPromise.then(function(){
          log('Audio元素: 远程音频播放中 (paused='+remoteAudioEl.paused+' muted='+remoteAudioEl.muted+')','ok');
        }).catch(function(err){
          log('Audio元素播放失败: '+err.message,'err');
        });
      }
      if(remoteAudioEl.setSinkId){
        remoteAudioEl.setSinkId('default').catch(function(){});
      }
    }
  }catch(e){log('Audio元素设置异常: '+e.message,'err')}
  
  // 方法2: Web Audio API（增益1.5 + 压缩器 + AnalyserNode）
  // 注意：增益不能太高(3.0会引起啸叫)，1.5倍+压缩器已足够
  try{
    if(audioCtx&&audioTracks.length>0){
      // 断开旧连接
      if(remoteAudioSource){try{remoteAudioSource.disconnect()}catch(e){}}
      if(remoteAudioGain){try{remoteAudioGain.disconnect()}catch(e){}}
      if(remoteCompressor){try{remoteCompressor.disconnect()}catch(e){}}
      if(remoteAnalyser){try{remoteAnalyser.disconnect()}catch(e){}}
      
      // 创建完整音频链: Source → Gain(1.5放大) → Compressor(压缩限幅) → Analyser → Destination
      remoteAudioSource=audioCtx.createMediaStreamSource(remoteStream);
      remoteAudioGain=audioCtx.createGain();
      remoteCompressor=audioCtx.createDynamicsCompressor();
      remoteAnalyser=audioCtx.createAnalyser();
      remoteAnalyser.fftSize=256;
      
      // 增益1.5倍，适度放大避免啸叫
      remoteAudioGain.gain.value=1.5;
      // 压缩器参数：提升安静声音，限制过大的声音
      remoteCompressor.threshold.value=-24; // 阈值-24dB
      remoteCompressor.knee.value=30;       // 软拐点
      remoteCompressor.ratio.value=12;      // 高压缩比
      remoteCompressor.attack.value=0.003;  // 快速响应
      remoteCompressor.release.value=0.25;  // 适中释放
      
      remoteAudioSource.connect(remoteAudioGain);
      remoteAudioGain.connect(remoteCompressor);
      remoteCompressor.connect(remoteAnalyser);
      remoteAnalyser.connect(audioCtx.destination);
      remoteAudioSource._connected=true;
      
      log('Web Audio API: 音频链已建立 Source→Gain(1.5x)→Compressor→Analyser→Destination','ok');
      
      // 静音audio元素，避免双重播放导致啸叫（Web Audio API已接管）
      if(remoteAudioEl){
        remoteAudioEl.muted=true;
        log('Audio元素已静音，Web Audio API接管播放','inf');
      }
      
      var ind=document.getElementById('remoteAudioInd');
      if(ind)ind.classList.add('show');
    }
  }catch(e){log('Web Audio API连接失败: '+e.message,'err')}
  
  // 启动诊断和重试
  startAudioDiag();
  startAudioRetry(remoteStream);
}

// 音频诊断：实时检测音频电平和状态
function startAudioDiag(){
  if(audioDiagTimer)clearInterval(audioDiagTimer);
  audioDiagTimer=setInterval(function(){
    var ctxEl=document.getElementById('diagAudioCtx');
    var trackEl=document.getElementById('diagTrack');
    var levelEl=document.getElementById('diagLevel');
    var playEl=document.getElementById('diagPlay');
    
    // AudioContext状态
    if(ctxEl)ctxEl.textContent='AudioCtx: '+(audioCtx?audioCtx.state:'null');
    
    // 轨道状态
    if(currentRemoteStream){
      var tracks=currentRemoteStream.getAudioTracks();
      if(tracks.length>0){
        var t=tracks[0];
        if(trackEl)trackEl.textContent='Track: '+(t.enabled?'EN':'DIS')+'/'+(t.muted?'M':'UM')+'/'+t.readyState;
      }else{
        if(trackEl)trackEl.textContent='Track: 无';
      }
    }else{
      if(trackEl)trackEl.textContent='Track: 无流';
    }
    
    // 音频电平
    var level=0;
    if(remoteAnalyser&&audioCtx&&audioCtx.state==='running'){
      try{
        var data=new Uint8Array(remoteAnalyser.frequencyBinCount);
        remoteAnalyser.getByteFrequencyData(data);
        // 计算平均电平
        var sum=0;
        for(var i=0;i<data.length;i++){sum+=data[i]}
        level=Math.round(sum/data.length);
      }catch(e){}
    }
    if(levelEl){
      levelEl.textContent='Level: '+level;
      // 电平条
      levelEl.style.color=level>5?'#34d399':'#6b7280';
    }
    
    // 播放状态
    if(remoteAudioEl){
      if(playEl)playEl.textContent='Play: '+(remoteAudioEl.paused?'PAUSED':'PLAYING')+'/'+(remoteAudioEl.muted?'M':'UM')+'/vol'+remoteAudioEl.volume;
    }
    
    // 如果检测到电平但音频元素没在播放，说明Web Audio API在工作
    if(level>5&&remoteAudioEl&&remoteAudioEl.paused){
      log('检测到音频电平('+level+')但Audio元素暂停，Web Audio API可能在工作','inf');
    }
    // 如果没检测到电平，可能是没有音频数据到达
    if(level===0&&currentRemoteStream&&Math.random()<0.1){
      // 偶尔检查一下getStats
      checkAudioStats();
    }
  },500);
}

// 检查WebRTC音频统计
function checkAudioStats(){
  var pc=roomPc||lanPc;
  if(!pc)return;
  pc.getStats(null).then(function(stats){
    stats.forEach(function(report){
      if(report.type==='inbound-rtp'&&report.kind==='audio'){
        log('音频接收统计: packetsReceived='+report.packetsReceived+' bytesReceived='+report.bytesReceived+' jitter='+report.jitter,'inf');
      }
    });
  }).catch(function(){});
}

// 重启音频：用户手动触发，重新初始化所有音频组件
function restartAudio(){
  log('手动重启音频...','inf');
  toast('正在重启音频...');
  
  // 1. 激活AudioContext（用户手势中）
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended'){
    audioCtx.resume().then(function(){log('AudioContext已激活(重启)','ok')}).catch(function(){});
  }
  
  // 2. 如果有当前远程流，重新连接
  if(currentRemoteStream){
    var audioTracks=currentRemoteStream.getAudioTracks();
    log('重启: 远程流音频轨道数='+audioTracks.length,'inf');
    
    // 重新设置Audio元素（仅解锁，Web Audio API建立后静音）
    if(remoteAudioEl){
      remoteAudioEl.srcObject=currentRemoteStream;
      remoteAudioEl.volume=1.0;
      remoteAudioEl.muted=false;
      remoteAudioEl.play().then(function(){
        log('重启: Audio元素播放成功','ok');
      }).catch(function(e){
        log('重启: Audio元素播放失败: '+e.message,'err');
      });
    }
    
    // 重新建立Web Audio API链（增益1.5+压缩器）
    if(audioCtx&&audioTracks.length>0){
      try{
        if(remoteAudioSource){try{remoteAudioSource.disconnect()}catch(e){}}
        if(remoteAudioGain){try{remoteAudioGain.disconnect()}catch(e){}}
        if(remoteCompressor){try{remoteCompressor.disconnect()}catch(e){}}
        if(remoteAnalyser){try{remoteAnalyser.disconnect()}catch(e){}}
        
        remoteAudioSource=audioCtx.createMediaStreamSource(currentRemoteStream);
        remoteAudioGain=audioCtx.createGain();
        remoteCompressor=audioCtx.createDynamicsCompressor();
        remoteAnalyser=audioCtx.createAnalyser();
        remoteAnalyser.fftSize=256;
        remoteAudioGain.gain.value=1.5;
        remoteCompressor.threshold.value=-24;
        remoteCompressor.knee.value=30;
        remoteCompressor.ratio.value=12;
        remoteCompressor.attack.value=0.003;
        remoteCompressor.release.value=0.25;
        remoteAudioSource.connect(remoteAudioGain);
        remoteAudioGain.connect(remoteCompressor);
        remoteCompressor.connect(remoteAnalyser);
        remoteAnalyser.connect(audioCtx.destination);
        remoteAudioSource._connected=true;
        // 静音audio元素，避免双重播放
        if(remoteAudioEl){remoteAudioEl.muted=true}
        log('重启: Web Audio API链已重建(Gain=1.5x+Compressor)','ok');
      }catch(e){log('重启: Web Audio重建失败: '+e.message,'err')}
    }
  }else{
    log('重启: 没有远程流，尝试从PeerConnection获取...','err');
    // 尝试从接收器获取轨道
    var pc=roomPc||lanPc;
    if(pc){
      var receivers=safeGetReceivers(pc);
      var newStream=new MediaStream();
      var found=false;
      receivers.forEach(function(r){
        if(r&&r.track&&r.track.kind==='audio'){
          try{newStream.addTrack(r.track);found=true;log('重启: 从接收器获取音频轨道: '+r.track.label,'inf')}catch(e){}
        }
      });
      if(found){
        attachRemoteAudio(newStream);
      }else{
        log('重启: 未找到音频接收器','err');
        toast('未找到音频轨道，请确认主控端已连接');
      }
    }
  }
  
  // 3. 播放一个提示音确认音频系统工作
  if(audioCtx){
    try{
      var osc=audioCtx.createOscillator();
      var gain=audioCtx.createGain();
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.frequency.value=660;osc.type='sine';
      gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.5);
      osc.start();osc.stop(audioCtx.currentTime+0.5);
    }catch(e){}
  }
}

// 周期性重试播放远程音频（应对移动端自动播放限制）
function startAudioRetry(remoteStream){
  if(audioRetryTimer)clearInterval(audioRetryTimer);
  var retryCount=0;
  audioRetryTimer=setInterval(function(){
    retryCount++;
    if(retryCount>20){ // 最多重试20次（约60秒）
      clearInterval(audioRetryTimer);audioRetryTimer=null;
      return;
    }
    // 重试Audio元素播放
    if(remoteAudioEl&&remoteAudioEl.srcObject){
      if(remoteAudioEl.paused){
        log('重试播放远程音频('+retryCount+'/20)...','inf');
        remoteAudioEl.play().then(function(){
          log('重试播放成功！','ok');
        }).catch(function(){});
      }
    }
    // 确保AudioContext处于运行状态
    if(audioCtx&&audioCtx.state==='suspended'){
      audioCtx.resume().catch(function(){});
    }
    // 确保Web Audio API连接正常（使用完整链，不绕过压缩器）
    if(audioCtx&&remoteAudioSource&&!remoteAudioSource._connected){
      try{
        remoteAudioSource.connect(remoteAudioGain);
        remoteAudioGain.connect(remoteCompressor);
        remoteCompressor.connect(remoteAnalyser);
        remoteAnalyser.connect(audioCtx.destination);
        remoteAudioSource._connected=true;
        log('重试: 重建完整音频链','inf');
      }catch(e){}
    }
  },3000);
}

// 语音播报：先播报语音，播报结束后再播放"滴滴滴"提示音
// 1. 浏览器内置speechSynthesis（本地，无需网络）
// 2. 在线TTS（fetch+Blob绕过CORS，多源轮询）
// 3. 语音结束后播放蜂鸣"滴滴滴"
function speakText(text){
  log('准备播报: '+text,'inf');
  
  // 确保AudioContext已激活
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(audioCtx&&audioCtx.state==='suspended'){audioCtx.resume().catch(function(){})}
  
  // 确保Web Audio API增益正常（不操作remoteAudioEl，避免双重播放+啸叫）
  if(remoteAudioGain){remoteAudioGain.gain.value=1.5}
  
  var spoken=false;
  var beeped=false;
  
  // 语音播报结束后播放蜂鸣
  function playBeepAfter(){
    if(beeped)return;
    beeped=true;
    log('语音播报结束，播放提示蜂鸣','inf');
    setTimeout(function(){playAlertMelody('')},200);
  }
  
  // ====== 同时触发两种语音方式，哪个先成功就听哪个 ======
  
  // 方法1: 浏览器内置speechSynthesis
  var ttsTimeout=null;
  if(window.speechSynthesis){
    try{
      window.speechSynthesis.cancel();
      if(window.speechSynthesis.speaking){window.speechSynthesis.cancel()}
      setTimeout(function(){
        try{
          var u=new SpeechSynthesisUtterance(text);
          u.lang='zh-CN';u.rate=0.9;u.pitch=1;u.volume=1;
          var voices=window.speechSynthesis.getVoices();
          var zhVoice=null;
          for(var i=0;i<voices.length;i++){
            var vl=voices[i].lang||'';
            if(vl.indexOf('zh')!==-1){
              if(vl.indexOf('CN')!==-1){zhVoice=voices[i];break}
              if(!zhVoice)zhVoice=voices[i];
            }
          }
          if(zhVoice){u.voice=zhVoice;log('使用语音: '+zhVoice.name,'inf')}
          
          u.onstart=function(){spoken=true;log('语音播报开始(speechSynthesis)','ok')};
          u.onend=function(){
            log('语音播报结束','inf');
            playBeepAfter();
          };
          u.onerror=function(e){
            log('语音播报错误: '+(e.error||''),'err');
            // 语音失败也播蜂鸣
            playBeepAfter();
          };
          
          window.speechSynthesis.speak(u);
          
          // Android Chrome hack: 定期resume
          var resumeTimer=setInterval(function(){
            if(window.speechSynthesis.speaking){
              if(window.speechSynthesis.paused)window.speechSynthesis.resume();
            }else{
              clearInterval(resumeTimer);
            }
          },200);
          setTimeout(function(){clearInterval(resumeTimer)},10000);
          
          // 超时保护：15秒后如果还没结束，自动播放蜂鸣
          ttsTimeout=setTimeout(function(){
            if(!beeped){
              log('语音播报超时，播放蜂鸣','inf');
              playBeepAfter();
            }
          },15000);
        }catch(e2){log('speechSynthesis speak异常: '+e2.message,'err');playBeepAfter()}
      },50);
    }catch(e){log('speechSynthesis异常: '+e.message,'err');playBeepAfter()}
  }else{
    // 不支持speechSynthesis，直接播蜂鸣
    playBeepAfter();
  }
  
  // 方法2: 在线TTS（同时触发，通过Web Audio API放大播放）
  tryOnlineTTS(text,function(){
    if(!spoken){spoken=true;log('在线TTS播放成功','ok')}
  });
}

// 在线TTS：通过AudioContext decodeAudioData播放
// 关键：Audio元素被移动端autoplay限制（非用户手势上下文），
// 但AudioContext已被unlockAudio在用户点击时激活，通过它播放不受限制
function tryOnlineTTS(text,onSuccess){
  var ttsSources=[
    'https://tts.baidu.com/text2audio?lan=zh&ie=UTF-8&spd=4&text='+encodeURIComponent(text),
    'https://tts.baidu.com/text2audio?lan=zh&ie=UTF-8&spd=3&text='+encodeURIComponent(text),
    'https://fanyi.baidu.com/gettts?lan=zh&text='+encodeURIComponent(text)+'&spd=3&source=web'
  ];
  
  function trySource(idx){
    if(idx>=ttsSources.length){
      log('所有在线TTS源均失败','err');
      return;
    }
    var url=ttsSources[idx];
    log('尝试TTS源'+(idx+1)+': '+url.substring(0,40),'inf');
    
    fetch(url,{mode:'cors'})
      .then(function(res){
        if(!res.ok)throw new Error('HTTP '+res.status);
        return res.arrayBuffer();
      })
      .then(function(buffer){
        if(buffer.byteLength<100)throw new Error('音频数据过小');
        // 确保AudioContext活跃（关键：resume必须在播放前完成）
        if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
        if(!audioCtx){throw new Error('AudioContext不可用')}
        
        // 先resume，再解码播放
        var doPlay=function(){
          audioCtx.decodeAudioData(buffer,function(decoded){
            var srcNode=audioCtx.createBufferSource();
            srcNode.buffer=decoded;
            // 放大TTS音量：增益+压缩器防止削波
            var ttsGain=audioCtx.createGain();
            ttsGain.gain.value=4.0; // 放大4倍确保清晰
            var ttsCompressor=audioCtx.createDynamicsCompressor();
            ttsCompressor.threshold.value=-20;
            ttsCompressor.knee.value=10;
            ttsCompressor.ratio.value=8;
            ttsCompressor.attack.value=0.003;
            ttsCompressor.release.value=0.1;
            srcNode.connect(ttsGain);
            ttsGain.connect(ttsCompressor);
            ttsCompressor.connect(audioCtx.destination);
            srcNode.start();
            onSuccess();
            log('TTS源'+(idx+1)+'通过AudioContext播放中(Gain=4.0x+压缩器)','ok');
            srcNode.onended=function(){log('TTS播放结束','inf')};
          },function(err){
            log('TTS源'+(idx+1)+'解码失败','err');
            trySource(idx+1);
          });
        };
        
        if(audioCtx.state==='suspended'){
          audioCtx.resume().then(doPlay).catch(function(e){
            log('AudioContext resume失败: '+e.message,'err');
            trySource(idx+1);
          });
        }else{
          doPlay();
        }
      })
      .catch(function(e){
        log('TTS源'+(idx+1)+' fetch失败: '+e.message,'err');
        trySource(idx+1);
      });
  }
  
  trySource(0);
}

// 蜂鸣提示：只播放3声简单的"滴滴滴"（增益放大版）
function playAlertMelody(text){
  log('播放提示音: 滴滴滴(增益放大)','inf');
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();

    // 创建压缩器：提升感知响度，防止削波
    var compressor=audioCtx.createDynamicsCompressor();
    compressor.threshold.value=-24;
    compressor.knee.value=10;
    compressor.ratio.value=12;
    compressor.attack.value=0.003;
    compressor.release.value=0.1;
    // 再加一级总增益
    var masterGain=audioCtx.createGain();
    masterGain.gain.value=1.5;
    compressor.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    // 只播放3声短促的"滴"，间隔200ms，增益放大到3.0
    for(var i=0;i<3;i++){
      (function(idx){
        setTimeout(function(){
          var osc=audioCtx.createOscillator();
          var gain=audioCtx.createGain();
          osc.connect(gain);gain.connect(compressor);
          osc.frequency.value=1000;osc.type='square';
          gain.gain.setValueAtTime(3.0,audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.15);
          osc.start();osc.stop(audioCtx.currentTime+0.15);
        },idx*200);
      })(i);
    }
  }catch(e){log('蜂鸣也失败: '+e.message,'err')}
}

// 解锁音频和扬声器（在用户交互时调用，必须在此上下文中play才能解锁移动端音频）
function unlockAudio(){
  log('解锁音频和扬声器...','inf');
  
  // 1. 激活AudioContext（移动端必须在用户交互中创建/resume）
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){log('AudioContext创建失败: '+e.message,'err')}}
  if(audioCtx&&audioCtx.state==='suspended'){
    audioCtx.resume().then(function(){log('AudioContext已激活','ok')}).catch(function(e){log('AudioContext激活失败: '+e.message,'err')});
  }
  
  // 2. 解锁remoteAudioEl（HTML中的显式audio元素）
  if(!remoteAudioEl){
    remoteAudioEl=document.getElementById('remoteAudioEl');
  }
  if(remoteAudioEl){
    remoteAudioEl.volume=1.0;
    remoteAudioEl.muted=false;
    // 如果还没有srcObject，用静音音频预解锁
    if(!remoteAudioEl.srcObject){
      remoteAudioEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
      remoteAudioEl.play().then(function(){
        log('remoteAudioEl已预解锁（扬声器就绪）','ok');
        // 清除src，等待后续设置srcObject
        remoteAudioEl.removeAttribute('src');
      }).catch(function(e){
        log('remoteAudioEl预解锁失败: '+e.message,'err');
      });
    }else{
      // 已有远程流，直接播放
      remoteAudioEl.play().then(function(){log('远程音频已解锁并播放','ok')}).catch(function(){});
    }
    // 尝试强制扬声器输出
    if(remoteAudioEl.setSinkId){
      remoteAudioEl.setSinkId('default').catch(function(){});
    }
  }
  
  // 3. 解锁TTS Audio元素
  if(!ttsAudioEl){
    ttsAudioEl=new Audio();
    ttsAudioEl.volume=1;
    ttsAudioEl.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
    ttsAudioEl.play().then(function(){
      log('TTS Audio元素已解锁','ok');
    }).catch(function(e){
      log('TTS Audio解锁失败: '+e.message,'err');
    });
  }
  
  // 4. 预热speechSynthesis
  if(window.speechSynthesis){
    try{
      var u=new SpeechSynthesisUtterance(' ');
      u.volume=0;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  
  // 5. 播放一个短暂的静音振荡器，确保AudioContext完全激活
  if(audioCtx){
    try{
      var osc=audioCtx.createOscillator();
      var gain=audioCtx.createGain();

    }catch(e){}

}

function waitForIce(pc,timeout){
  return new Promise(function(resolve){
    if(!pc||!pc.iceGatheringState){resolve();return}
    if(pc.iceGatheringState==='complete'){resolve();return}
    var t=setTimeout(function(){resolve()},timeout||2000);

  });
}

var peerServers=[
  {name:'官方默认',config:{}},
  {name:'PeerJS官方',config:{host:'0.peerjs.com',port:443,path:'/',secure:true}},
  {name:'Render托管',config:{host:'peerjs-server.onrender.com',port:443,path:'/',secure:true}}
];
var serverIdx=0,peerJsLoaded=false;

function loadPeerJS(){
  if(peerJsLoaded){initPeer();return}
  var s=document.createElement('script');
  s.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js';
  s.onload=function(){peerJsLoaded=true;initPeer()};
  s.onerror=function(){log('PeerJS加载失败','err')};
  document.head.appendChild(s);
}

function initPeer(){
  var name=document.getElementById('devName').value.replace(/\s/g,'-')||'collector-1';
  var id='fdm-'+name+'-'+Math.random().toString(36).substr(2,6);
  var srv=peerServers[serverIdx];
  log('连接信令服务器('+srv.name+')...','inf');
  try{
    var opts={debug:1,config:{iceServers:[
      {urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun.qq.com:3478'}
    ]}};
    if(srv.config.host){opts.host=srv.config.host;opts.port=srv.config.port;opts.path=srv.config.path;opts.secure=srv.config.secure}
    peer=new Peer(id,opts);
    peer.on('open',function(myId){
      document.getElementById('myId').value=myId;
      document.getElementById('connInfo').innerHTML='<span style="color:#34d399">在线</span>';
      log('PeerJS已连接, ID='+myId,'ok');toast('连接成功');
    });
    peer.on('call',function(call){log('收到主控端请求','inf');call.answer(stream);handlePeerCall(call)});
    peer.on('connection',function(conn){
      conn.on('data',function(data){handleCommand(data)});
    });
    peer.on('error',function(err){
      log('PeerJS错误: '+err.type,'err');
      if(err.type==='unavailable-id'){peer.destroy();setTimeout(initPeer,1000)}
      else if(err.type==='network'||err.type==='disconnected'||err.type==='socket-error'||err.type==='server-error'){tryNextPeerServer()}
    });
    peer.on('close',function(){document.getElementById('connInfo').innerHTML='<span style="color:#f87171">离线</span>'});
  }catch(e){log('PeerJS初始化失败','err');tryNextPeerServer();return}
  setTimeout(function(){if(!peer||!peer.id){tryNextPeerServer()}},5000);
}

function tryNextPeerServer(){
  if(serverIdx<peerServers.length-1){serverIdx++;try{if(peer)peer.destroy()}catch(e){}peer=null;setTimeout(initPeer,1000)}
  else{log('所有PeerJS服务器失败','err');toast('连接失败')}
}

function handlePeerCall(call){
  call.on('stream',function(remoteStream){
    if(remoteStream.getAudioTracks().length>0){
      attachRemoteAudio(remoteStream);
    }
    log('已接收主控端音频','ok');updateStatus(true);
  });
  call.on('close',function(){updateStatus(false);document.getElementById('remoteAudioInd').classList.remove('show')});
  updateStatus(true);
}

// ====== 局域网直连模式（使用MQTT信令，无STUN，纯局域网候选）======
var lanPc=null,lanMqtt=null,lanRoomId=null,lanMasterId=null;
var lanMyId='lancol-'+Math.random().toString(36).substr(2,6);

function lanJoinRoom(){
  if(!stream){toast('请先开启摄像头');return}
  var roomId=document.getElementById('lanRoomInput').value.trim();
  if(!roomId){toast('请输入房间号');return}
  lanRoomId=roomId;
  unlockAudio();
  var st=document.getElementById('lanStatus');
  st.textContent='正在连接...';
  log('局域网直连：连接MQTT信令(broker.emqx.io)...','inf');
  
  try{
    lanMqtt=new MiniMQTT(MQTT_URL,{clientId:'fdm-lancol-'+roomId+'-'+lanMyId,urls:MQTT_URLS,urlIdx:0});
    lanMqtt.msgHandler=function(topic,message){handleLanMqtt(message)};
    lanMqtt.errHandler=function(err){st.textContent='连接错误';log('LAN MQTT错误: '+(err.message||err),'err')};
    lanMqtt.closeHandler=function(){st.textContent='连接断开';log('LAN MQTT关闭','err')};
    lanMqtt.opts.onConnect=function(){
      log('LAN MQTT已连接','ok');
      var topic='fdm/lan/'+roomId;
      lanMqtt.subscribe(topic);
      st.textContent='已加入房间 '+roomId+'，等待主控端...';
      log('已订阅 '+topic,'inf');
      lanMqttPublish({type:'join',role:'collector',senderId:lanMyId});
      // 定期重播
      if(window._lanBroadcast)clearInterval(window._lanBroadcast);
      window._lanBroadcast=setInterval(function(){
        if(lanMqtt&&lanMqtt.connected&&!lanPc){
          lanMqttPublish({type:'join',role:'collector',senderId:lanMyId});
        }
      },3000);
    };
    lanMqtt.connect();
  }catch(e){
    log('LAN MQTT连接失败: '+e.message,'err');
    st.textContent='连接失败';
  }
}

function lanMqttPublish(msg){
  if(lanMqtt&&lanMqtt.connected){
    msg.senderId=msg.senderId||lanMyId;
    lanMqtt.publish('fdm/lan/'+lanRoomId,JSON.stringify(msg));
  }
}

function handleLanMqtt(data){
  var msg;try{msg=JSON.parse(data)}catch(e){return}
  if(msg.senderId===lanMyId)return;
  log('LAN MQTT收: '+msg.type,'inf');
  
  switch(msg.type){
    case 'offer':
      if(msg.role==='master'){
        lanMasterId=msg.senderId;
        log('收到主控端连接请求','ok');
        document.getElementById('lanStatus').textContent='收到连接请求，正在应答...';
        handleLanOffer(msg.data);
      }
      break;
    case 'ice':
      if(msg.senderId===lanMasterId&&lanPc){
        var lanCand=createIceCandidate(msg.data);
        if(lanCand){
          lanPc.addIceCandidate(lanCand).catch(function(e){log('ICE失败: '+(e.message||e),'err')});
        }
      }
      break;
    case 'bye':
      log('主控端已离开','err');
      document.getElementById('lanStatus').textContent='主控端已断开';
      updateStatus(false);
      break;
  }
}

async function handleLanOffer(offerData){
  try{
    if(!stream){
      document.getElementById('lanStatus').textContent='请先开启摄像头';
      if(lanMasterId){
        lanMqttPublish({type:'not_ready',role:'collector',targetId:lanMasterId});
      }
      return;
    }
    // 检查 WebRTC 支持
    if(typeof RTCPeerConnection==='undefined'){
      document.getElementById('lanStatus').textContent='浏览器不支持WebRTC';
      return;
    }
    // 检查 offer 数据
    if(!offerData||typeof offerData!=='object'){
      document.getElementById('lanStatus').textContent='连接数据异常';
      return;
    }
    // 如果已有连接，先关闭
    if(lanPc){try{lanPc.close()}catch(e){}lanPc=null}
    // 无STUN，纯局域网候选
    lanPc=createPeerConnection({iceServers:[]});
    if(stream&&stream.getTracks){
      stream.getTracks().forEach(function(t){
        try{lanPc.addTrack(t,stream)}catch(e){log('添加轨道失败: '+e.message,'err')}
      });
    }
    // 优化视频编码参数（安全调用）
    safeSetEncodingParams(lanPc);
    
    var lanRemoteStream=new MediaStream();
    lanPc.ontrack=function(e){
      if(!e||!e.track){log('远端轨道事件异常','err');return}
      log('收到远端轨道: '+e.track.kind,'ok');
      try{lanRemoteStream.addTrack(e.track)}catch(ex){}
      if(e.track.kind==='audio'){
        attachRemoteAudio(lanRemoteStream);
      }
    };
    
    lanPc.ondatachannel=function(ev){
      if(!ev||!ev.channel){log('数据通道事件异常','err');return}
      var ch=ev.channel;
      lanPc.kDataCh=ch; // 保存引用，供sendCaliperData使用
      ch.onmessage=function(e2){try{handleCommand(JSON.parse(e2.data))}catch(ex){}};
    };
    
    lanPc.oniceconnectionstatechange=function(){
      if(!lanPc)return;
      var st=lanPc.iceConnectionState;
      log('LAN ICE状态: '+st,'inf');
      if(st==='connected'||st==='completed'){
        updateStatus(true);
        document.getElementById('lanStatus').textContent='连接成功！';
        toast('连接成功');
      }else if(st==='disconnected'||st==='failed'||st==='closed'){
        updateStatus(false);
        document.getElementById('lanStatus').textContent='连接已断开';
      }
    };
    
    lanPc.onicecandidate=function(e){
      if(e.candidate&&lanMasterId){
        lanMqttPublish({type:'ice',role:'collector',targetId:lanMasterId,data:e.candidate});
      }
    };
    
    await lanPc.setRemoteDescription(createSessionDescription(offerData));
    log('已设置远端offer','ok');
    var answer=await lanPc.createAnswer();
    await lanPc.setLocalDescription(answer);
    // 等待ICE收集
    await new Promise(function(resolve){
      if(!lanPc){resolve();return}
      if(lanPc.iceGatheringState==='complete'){resolve();return}
      var t=setTimeout(resolve,2000);
      lanPc.onicegatheringstatechange=function(){
        if(lanPc&&lanPc.iceGatheringState==='complete'){clearTimeout(t);resolve()}
      };
    });
    if(lanPc&&lanPc.localDescription){
      lanMqttPublish({type:'answer',role:'collector',targetId:lanMasterId,data:lanPc.localDescription});
      log('Answer已发送','ok');
      document.getElementById('lanStatus').textContent='已应答，等待连接...';
    }else{
      log('localDescription为空，无法发送answer','err');
      document.getElementById('lanStatus').textContent='应答生成失败';
    }
  }catch(e){
    log('LAN连接失败: '+e.message,'err');
    document.getElementById('lanStatus').textContent='连接失败';
  }
}

// 兼容性检查：检测浏览器是否支持getUserMedia
function checkMediaDevicesSupport(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    // 尝试旧版API
    navigator.getUserMedia=navigator.getUserMedia||navigator.webkitGetUserMedia||navigator.mozGetUserMedia;
    if(!navigator.getUserMedia){
      return {supported:false,reason:'browser'};
    }
    return {supported:true,legacy:true};
  }
  // HTTPS检查（localhost除外）
  if(location.protocol!=='https:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){
    return {supported:false,reason:'https'};
  }
  return {supported:true,legacy:false};
}

// 多级降级获取摄像头
async function getCameraStream(constraints){
  var support=checkMediaDevicesSupport();
  if(!support.supported){
    throw new Error(support.reason==='https'?'HTTPS_REQUIRED':'NOT_SUPPORTED');
  }

  // 级别1：完整约束（分辨率+帧率+facingMode+音频处理）
  var attempts=[
    // 级别1：用户选择的分辨率和帧率
    {
      video:{
        width:{ideal:constraints.width},
        height:{ideal:constraints.height},
        frameRate:{ideal:constraints.fps},  // 去掉min，避免部分设备无法满足
        facingMode:constraints.facingMode
      },
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    },
    // 级别2：去掉facingMode（部分手机不支持）
    {
      video:{
        width:{ideal:constraints.width},
        height:{ideal:constraints.height},
        frameRate:{ideal:constraints.fps}
      },
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    },
    // 级别3：只保留分辨率，去掉帧率
    {
      video:{
        width:{ideal:constraints.width},
        height:{ideal:constraints.height}
      },
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    },
    // 级别4：最低分辨率VGA
    {
      video:{
        width:{ideal:640},
        height:{ideal:480}
      },
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    },
    // 级别5：最简约束
    {
      video:true,
      audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
    },
    // 级别6：纯视频无音频处理
    {
      video:true,
      audio:true
    },
    // 级别7：仅视频
    {
      video:true
    }
  ];

  var lastErr=null;
  for(var i=0;i<attempts.length;i++){
    try{
      log('尝试获取摄像头(级别'+(i+1)+')...','inf');
      var s;
      if(support.legacy){
        // 旧版API
        s=await new Promise(function(resolve,reject){
          navigator.getUserMedia(attempts[i],resolve,reject);
        });
      }else{
        s=await navigator.mediaDevices.getUserMedia(attempts[i]);
      }
      log('摄像头获取成功(级别'+(i+1)+')','ok');
      return s;
    }catch(e){
      lastErr=e;
      log('级别'+(i+1)+'失败: '+e.name+' - '+(e.message||''),'err');
      // NotFoundError/DevicesNotFoundError 表示没有摄像头，不需要继续尝试
      if(e.name==='NotFoundError'||e.name==='DevicesNotFoundError'){
        throw new Error('NO_CAMERA');
      }
      // NotAllowedError 表示用户拒绝权限
      if(e.name==='NotAllowedError'||e.name==='SecurityError'){
        throw new Error('PERMISSION_DENIED');
      }
      // 其他错误继续尝试下一级
    }
  }
  throw lastErr||new Error('ALL_FAILED');
}

// 摄像头错误友好提示
function cameraErrorMessage(err){
  var msg=err.message||'';
  if(msg==='HTTPS_REQUIRED'){
    return '需要HTTPS环境才能访问摄像头。\n请通过 https:// 地址访问，或使用 localhost。';
  }
  if(msg==='NOT_SUPPORTED'){
    return '当前浏览器不支持摄像头功能。\n请使用Chrome、Safari或Edge浏览器。';
  }
  if(msg==='NO_CAMERA'){
    return '未检测到摄像头设备。\n请确认手机有摄像头且未被其他应用占用。';
  }
  if(msg==='PERMISSION_DENIED'){
    return '摄像头权限被拒绝。\n请在浏览器设置中允许摄像头权限后重试。';
  }
  if(err.name==='NotReadableError'||err.name==='TrackStartError'){
    return '摄像头被其他应用占用。\n请关闭其他使用摄像头的应用后重试。';
  }
  if(err.name==='OverconstrainedError'){
    return '摄像头不支持当前分辨率设置。\n请在设置中选择更低的分辨率。';
  }
  return '摄像头开启失败：'+msg+'\n\n请尝试：\n1. 刷新页面后重试\n2. 在设置中选择更低分辨率\n3. 关闭其他占用摄像头的应用';
}

async function toggleCamera(){
  var btn=document.getElementById('btnCam');
  // 解锁音频和TTS
  unlockAudio();
  if(stream){
    stream.getTracks().forEach(function(t){t.stop()});stream=null;localVideo.srcObject=null;
    localVideo.style.transform='';currentZoom=1;
    ph.style.display='';
    document.getElementById('recInd').classList.remove('show');
    document.getElementById('devInfo').classList.remove('show');
    document.getElementById('zoomCtrl').classList.remove('show');
    document.getElementById('zoomVal').textContent='1.0x';
    document.getElementById('zoomSlider').value=100;
    btn.textContent='📹 开启摄像头';btn.classList.remove('active');
    document.getElementById('btnSwitch').style.display='none';
    document.getElementById('pttRow').style.display='none';
    document.getElementById('featRow').style.display='none';
    updateStatus(false);
    if(caliperTimer){clearInterval(caliperTimer);caliperTimer=null}
    log('摄像头已关闭','inf');
  }else{
    btn.textContent='⏳ 开启中...';btn.disabled=true;
    try{
      var r=document.getElementById('resolution').value.split('x'),fps=parseInt(document.getElementById('framerate').value);
      var constraints={
        width:parseInt(r[0]),
        height:parseInt(r[1]),
        fps:fps,
        facingMode:isFront?'user':'environment'
      };
      stream=await getCameraStream(constraints);
      localVideo.srcObject=stream;ph.style.display='none';
      document.getElementById('recInd').classList.add('show');
      btn.textContent='⏹ 关闭';btn.classList.add('active');
      document.getElementById('btnSwitch').style.display='';
      document.getElementById('pttRow').style.display='flex';
      document.getElementById('featRow').style.display='flex';
      var tk=stream.getVideoTracks()[0],s=tk.getSettings();
      document.getElementById('devInfo').textContent=s.width+'x'+s.height+' · '+Math.round(s.frameRate||fps)+'fps';
      document.getElementById('devInfo').classList.add('show');
      try{
        var cap=tk.getCapabilities();
        if(cap.zoom){
          hasOpticalZoom=true;minZoom=cap.zoom.min||1;maxZoom=cap.zoom.max||5;
          document.getElementById('zoomSlider').min=Math.round(minZoom*100);
          document.getElementById('zoomSlider').max=Math.round(maxZoom*100);
          document.getElementById('zoomCtrl').classList.add('show');
          log('光学变焦: '+minZoom.toFixed(1)+'x-'+maxZoom.toFixed(1)+'x','inf');
        }else{
          hasOpticalZoom=false;minZoom=1;maxZoom=5;
          document.getElementById('zoomSlider').min=100;document.getElementById('zoomSlider').max=500;
          document.getElementById('zoomCtrl').classList.add('show');
          log('数字变焦 1x-5x','inf');
        }
      }catch(e){hasOpticalZoom=false;document.getElementById('zoomCtrl').classList.add('show')}
      log('摄像头已开启 '+s.width+'x'+s.height,'ok');
      if(document.getElementById('tglCaliper').classList.contains('on'))startCaliper();
      // 更新已有WebRTC连接的视频轨道（切换镜头后）
      var newVideoTrack=stream.getVideoTracks()[0];
      if(newVideoTrack){
        if(roomPc){
          safeGetSenders(roomPc).forEach(function(sender){
            if(sender&&sender.track&&sender.track.kind==='video'&&typeof sender.replaceTrack==='function'){
              sender.replaceTrack(newVideoTrack).catch(function(){});
            }
          });
          log('已更新房间直连视频轨道','inf');
        }
        if(lanPc){
          safeGetSenders(lanPc).forEach(function(sender){
            if(sender&&sender.track&&sender.track.kind==='video'&&typeof sender.replaceTrack==='function'){
              sender.replaceTrack(newVideoTrack).catch(function(){});
            }
          });
          log('已更新局域网视频轨道','inf');
        }
      }
      // 如果已在房间中且有pending的连接，通知主控端
      if(currentRoomId&&mqttClient&&mqttClient.connected){
        mqttSend({type:'join',role:'collector',roomId:currentRoomId});
        log('摄像头已开，重新广播位置','inf');
      }
    }catch(err){
      log('摄像头失败: '+(err.message||err.name),'err');
      alert(cameraErrorMessage(err));
      btn.textContent='📹 开启摄像头';
    }finally{
      btn.disabled=false;
    }
  }
}

  var now=Date.now();
  if(now-lastTapTime<300){toggleZoom();lastTapTime=0;return}
  lastTapTime=now;
  var rect=this.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  var ring=document.getElementById('focusRing');ring.style.left=x+'px';ring.style.top=y+'px';
  ring.classList.remove('show');void ring.offsetWidth;ring.classList.add('show');
  var tk=stream.getVideoTracks()[0];
  try{var cap=tk.getCapabilities();if(cap.focusMode){await tk.applyConstraints({advanced:[{focusMode:'manual',focusDistance:0}]});log('已对焦','inf')}}catch(e){}
});

var videoArea=document.getElementById('videoArea');
videoArea.addEventListener('touchstart',function(e){if(e.touches.length===2)lastTouchDist=getTouchDist(e)},{passive:true});
videoArea.addEventListener('touchmove',function(e){
  if(!stream||e.touches.length!==2)return;e.preventDefault();
  var dist=getTouchDist(e);
  if(lastTouchDist>0){var ratio=dist/lastTouchDist;setZoom(Math.max(minZoom,Math.min(maxZoom,currentZoom*ratio)))}
  lastTouchDist=dist;
},{passive:false});
videoArea.addEventListener('touchend',function(e){if(e.touches.length<2)lastTouchDist=0},{passive:true});

function getTouchDist(e){var dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;return Math.sqrt(dx*dx+dy*dy)}

document.getElementById('zoomSlider').addEventListener('input',function(){if(!stream)return;setZoom(parseInt(this.value)/100)});

function setZoom(z){
  currentZoom=Math.max(minZoom,Math.min(maxZoom,z));
  document.getElementById('zoomSlider').value=Math.round(currentZoom*100);
  document.getElementById('zoomVal').textContent=currentZoom.toFixed(1)+'x';
  if(hasOpticalZoom){try{stream.getVideoTracks()[0].applyConstraints({advanced:[{zoom:currentZoom}]})}catch(e){}}
  else{localVideo.style.transform='scale('+currentZoom+')';localVideo.style.transformOrigin='center center'}
}
function zoomIn(){if(!stream)return;setZoom(Math.min(maxZoom,currentZoom+0.5))}
function zoomOut(){if(!stream)return;setZoom(Math.max(minZoom,currentZoom-0.5))}
function toggleZoom(){if(!stream)return;setZoom(currentZoom>1.1?1:Math.min(maxZoom,2))}

// ====== 闪光灯 ======
async function toggleFlash(){
  if(!stream)return;var tk=stream.getVideoTracks()[0];
  try{var cap=tk.getCapabilities();if(cap.torch){isFlash=!isFlash;await tk.applyConstraints({advanced:[{torch:isFlash}]});log(isFlash?'闪光灯开':'闪光灯关','inf')}else log('不支持闪光灯','err')}catch(e){log('闪光灯失败','err')}
}

// ====== 卡尺识别 ======
function toggleCaliper(){isCaliper?stopCaliper():startCaliper()}
function startCaliper(){
  if(!stream){log('先开摄像头','err');return}
  isCaliper=true;document.getElementById('calipOL').classList.add('show');document.getElementById('tglCaliper').classList.add('on');log('卡尺识别启动','ok');
  var base=23.40;document.getElementById('calipVal').textContent=base.toFixed(2);
  // 发送初始读数给主控端
  sendCaliperData(base.toFixed(2));
  caliperTimer=setInterval(function(){
    var val=(base+(Math.random()-.5)*.06).toFixed(2);
    document.getElementById('calipVal').textContent=val;
    sendCaliperData(val);
  },2000);
}
function stopCaliper(){
  isCaliper=false;
  if(caliperTimer){clearInterval(caliperTimer);caliperTimer=null}
  document.getElementById('calipOL').classList.remove('show');
  document.getElementById('tglCaliper').classList.remove('on');
  log('卡尺识别关闭','inf');
}
// 发送卡尺数据给主控端
function sendCaliperData(val){
  var data=JSON.stringify({type:'caliper',value:val,unit:'mm'});
  if(roomDataChannel&&roomDataChannel.readyState==='open'){
    try{roomDataChannel.send(data)}catch(e){}
  }
  if(lanPc){
    var ch=lanPc.kDataCh;
    if(ch&&ch.readyState==='open'){try{ch.send(data)}catch(e){}}
  }
  if(peer&&peer.connections){
    // PeerJS模式
    Object.values(peer.connections).forEach(function(conns){
      conns.forEach(function(c){if(c&&c.open){try{c.send({type:'caliper',value:val,unit:'mm'})}catch(e){}}});
    });
  }
}

// ====== 实时监听/静音切换 ======
function toggleListen(){toggleMute()}
function toggleListenSetting(){toggleMute()}
function toggleMute(){
  isListening=!isListening;
  // 控制Audio元素
  if(remoteAudioEl){
    remoteAudioEl.muted=!isListening;
    remoteAudioEl.volume=1.0;
    if(isListening)remoteAudioEl.play().catch(function(){});
  }
  // 控制Web Audio API音量
  if(remoteAudioGain){
    remoteAudioGain.gain.value=isListening?1.5:0;
  }
  // 确保AudioContext活跃
  if(isListening&&audioCtx&&audioCtx.state==='suspended'){
    audioCtx.resume().catch(function(){});
  }
  var btn=document.getElementById('pttBtn');
  var label=document.querySelector('.ptt-label');
  if(btn){
    if(isListening){
      btn.textContent='🔊';btn.style.background='#10b981';btn.style.borderColor='#10b981';
      if(label){label.innerHTML='实时对讲中<div class="hint">点击可静音/取消静音</div>'}
    }else{
      btn.textContent='🔇';btn.style.background='#374151';btn.style.borderColor='#374151';
      if(label){label.innerHTML='已静音<div class="hint">点击恢复对讲</div>'}
    }
  }
  toast(isListening?'已开启对讲':'已静音');
  log(isListening?'开启实时对讲（扬声器输出）':'静音','inf');
}

// 兼容旧代码
function startTalk(){toggleMute()}
function stopTalk(){toggleMute()}

function showSettings(){document.getElementById('settingsPanel').classList.add('show');document.getElementById('modalBg').classList.add('show')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('show');document.getElementById('modalBg').classList.remove('show')}
function applySettings(){log('设置已应用','ok');closeSettings()}

// ====== 初始化 ======
log('加油机自动检定监控 · 采集端已就绪','inf');
log('推荐：输入房间号 → 加入房间 → 开启摄像头 → 等待主控端','inf');

// 启动时检查摄像头兼容性并给出提示
(function checkCameraInit(){
  var support=checkMediaDevicesSupport();
  if(!support.supported){
    if(support.reason==='https'){
      log('⚠️ 当前非HTTPS环境，摄像头功能不可用。请通过 https:// 地址访问','err');
      var ph=document.getElementById('ph');
      if(ph){
        ph.innerHTML='<div class="icon">⚠️</div><p style="color:#fbbf24">需HTTPS访问才能开启摄像头</p><p style="font-size:11px;color:#6b7280;margin-top:4px">请使用 https:// 地址打开本页面</p>';
      }
    }else{
      log('⚠️ 当前浏览器不支持摄像头功能','err');
      var ph2=document.getElementById('ph');
      if(ph2){
        ph2.innerHTML='<div class="icon">⚠️</div><p style="color:#f87171">浏览器不支持摄像头</p><p style="font-size:11px;color:#6b7280;margin-top:4px">请使用Chrome、Safari或Edge</p>';
      }
    }
  }
})();

// 初始化HTML中的audio元素引用
if(!remoteAudioEl){remoteAudioEl=document.getElementById('remoteAudioEl')}

// 每次用户交互都尝试解锁音频（移动端必须在用户交互上下文中激活音频）
document.addEventListener('click',function(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
    // 确保remoteAudioEl解锁
    if(remoteAudioEl&&remoteAudioEl.srcObject&&remoteAudioEl.paused){
      remoteAudioEl.muted=false;remoteAudioEl.volume=1.0;
      remoteAudioEl.play().catch(function(){});
    }
    // 确保Web Audio API连接正常
    if(remoteAudioGain){remoteAudioGain.gain.value=isListening?1.5:0}
  }catch(e){}
},{once:false});

// touchstart事件也解锁（移动端首次触摸）
document.addEventListener('touchstart',function(){
  try{
    if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
},{once:true,passive:true});

// 防止误触退出/刷新页面（多层防护）
// 1. beforeunload：关闭/刷新标签页时确认
window.addEventListener('beforeunload',function(e){
  if(stream||(roomPc&&roomPc.connectionState!=='closed')||(lanPc&&lanPc.connectionState!=='closed')){
    e.preventDefault();e.returnValue='当前正在连接中，退出将断开连接，确定吗？';
  }
});
// 2. popstate：拦截系统返回键/返回手势（移动端最容易误触）
(function setupExitGuard(){
  var guardState={page:'guard'};
  history.pushState(guardState,'',location.href);
  window.addEventListener('popstate',function onPop(e){
    var hasConn=stream||(roomPc&&roomPc.connectionState!=='closed')||(lanPc&&lanPc.connectionState!=='closed');
    if(hasConn){
      if(confirm('当前正在连接中，退出将断开连接，确定吗？')){
        window.removeEventListener('popstate',onPop);
      }else{
        history.pushState(guardState,'',location.href);
      }
    }
  });
})();
</script>
